<title>hive 市场与接单台</title>
<style>
/* Layout: lab shell (theme-aware) around two fixed-palette phones in the settled 支付宝账单式 style: buyer market home and seller dispatch desk. */
:root {
  --bg: #f3f3f1; --panel: #ffffff; --fg: #1c1c1a; --muted: #6b6b66; --line: #deddd8; --chip: #e9e8e4; --accent: #2f5bd3; --frame: #1c1c1a;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #171716; --panel: #212120; --fg: #ecebe6; --muted: #9c9b95; --line: #343431; --chip: #2c2c2a; --accent: #7d9cf0; --frame: #3a3a37; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #171716; --panel: #212120; --fg: #ecebe6; --muted: #9c9b95; --line: #343431; --chip: #2c2c2a; --accent: #7d9cf0; --frame: #3a3a37; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-inline: 16px; padding-block: 24px 48px; max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.lab-head h1 { margin: 0; font-size: 22px; text-wrap: balance; }
.lab-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 70ch; line-height: 1.6; }
.seg { display: flex; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 0; border-radius: 7px; font-size: 13px; }
.seg button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tabs { display: none; }
.frames { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.spec { display: flex; flex-direction: column; gap: 10px; min-width: 0; align-items: center; }
.spec-meta { width: 100%; max-width: 375px; }
.spec-meta b { font-size: 14px; }
.spec-meta p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.phone { width: 100%; max-width: 375px; height: 760px; border: 9px solid var(--frame); border-radius: 46px; overflow: hidden; background: #fff; position: relative; }
.screen { height: 100%; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.screen > div { flex: 1 0 auto; display: flex; flex-direction: column; }
@media (max-width: 820px) {
  .tabs { display: flex; }
  .frames { grid-template-columns: 1fr; }
  .spec:not(.focus) { display: none; }
  .phone { height: 80svh; max-width: 430px; border-width: 6px; border-radius: 30px; }
}
.tnum { font-variant-numeric: tabular-nums; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes ripple { from { transform: scale(.6); opacity: .5; } to { transform: scale(1.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===== phone content: 支付宝账单式 ===== */
.ph { --blue: #1677ff; --blue-soft: #e8f1ff; --ink: #1a1a1a; --sub: #8c8c8c; --line: #f0f0f0; --red: #ff4d2d; --ok: #00b578; --warn: #ff8f1f;
  background: #f5f5f5; color: var(--ink); font-size: 14px; }
.card { margin: 10px 12px 0; background: #fff; border-radius: 10px; padding: 14px; }
.card h4 { margin: 0 0 12px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.card h4 span { font-size: 12px; font-weight: 400; color: var(--sub); }
.btn { border: 0; border-radius: 8px; padding: 13px; font-size: 16px; font-weight: 500; background: var(--blue); color: #fff; width: 100%; }
.btn.sm { width: auto; padding: 7px 14px; font-size: 13px; border-radius: 16px; }
.btn.line { background: #fff; color: var(--ink); border: 1px solid #d9d9d9; }
.btn:disabled { background: #bcd6ff; }
.link { border: 0; background: transparent; color: var(--sub); font-size: 13px; padding: 6px; }
.tag { font-size: 10px; border: 1px solid var(--blue); color: var(--blue); border-radius: 3px; padding: 0 3px; margin-left: 4px; vertical-align: 1px; white-space: nowrap; }
.tag.person { border-color: #bfbfbf; color: var(--sub); }
.agent-ic { width: 28px; height: 28px; border-radius: 50%; background: var(--blue); flex: none; display: grid; place-items: center; }
.tabbar { position: sticky; bottom: 0; margin-top: auto; background: #fff; border-top: 1px solid #eee; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 0 18px; }
.tabbar span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: #999; }
.tabbar span i { width: 22px; height: 22px; border-radius: 6px; background: #e5e5e5; }
.tabbar span.on { color: var(--blue); }
.tabbar span.on i { background: var(--blue); }

/* market */
.m-top { background: #fff; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.m-title { display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: 600; padding: 0 4px; }
.m-title small { font-size: 12px; font-weight: 400; color: var(--sub); }
.m-search { background: #f5f5f5; border-radius: 18px; padding: 9px 14px; color: #a6a6a6; font-size: 13.5px; }
.m-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 0; }
.m-grid div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
.m-grid i { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 13px; color: #fff; }
.m-pending { display: flex; gap: 10px; align-items: center; }
.m-pending .tx { flex: 1; min-width: 0; font-size: 13.5px; }
.m-pending small { display: block; color: var(--warn); font-size: 12px; margin-top: 2px; }
.cap { border-top: 1px solid var(--line); padding: 12px 0; }
.cap:first-of-type { border-top: 0; padding-top: 0; }
.cap-hd { display: flex; gap: 10px; align-items: flex-start; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; color: inherit; }
.cap-hd i { width: 40px; height: 40px; border-radius: 10px; flex: none; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 12px; color: #fff; line-height: 1.15; text-align: center; }
.cap-hd .tx { flex: 1; min-width: 0; }
.cap-hd b { font-size: 15px; font-weight: 500; }
.cap-hd small { display: block; color: var(--sub); font-size: 12px; margin-top: 3px; line-height: 1.5; }
.cap-hd .pr { color: var(--red); font-size: 15px; font-weight: 600; white-space: nowrap; }
.cap-hd .pr small { display: inline; color: var(--sub); font-weight: 400; }
.cap-meta { display: flex; gap: 12px; margin: 8px 0 0 50px; font-size: 12px; color: var(--sub); }
.cap-meta .on::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 4px; vertical-align: 1px; }
.sellers { margin: 10px 0 0 50px; display: flex; flex-direction: column; gap: 0; }
.seller { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.seller .av { width: 30px; height: 30px; border-radius: 50%; background: var(--blue-soft); color: #0b57c9; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.seller .tx { flex: 1; min-width: 0; }
.seller small { display: block; color: var(--sub); font-size: 11.5px; }
.seller .pr { font-weight: 500; }

/* dispatch desk */
.d-head { background: #fff; padding: 12px 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.d-nav { width: 100%; display: flex; justify-content: space-between; font-size: 16px; }
.d-nav b { font-weight: 500; font-size: 17px; }
.d-toggle { width: 132px; height: 132px; border-radius: 50%; border: 0; display: grid; place-items: center; position: relative; margin-top: 8px; font-size: 18px; font-weight: 600; background: #f0f0f0; color: var(--ink); }
.d-toggle.on { background: var(--blue); color: #fff; }
.d-toggle.on::before, .d-toggle.on::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--blue); animation: ripple 2.4s ease-out infinite; }
.d-toggle.on::after { animation-delay: 1.2s; }
.d-toggle small { display: block; font-size: 12px; font-weight: 400; opacity: .85; margin-top: 2px; }
.d-toggle:disabled { cursor: default; }
.d-state { font-size: 13px; color: var(--sub); }
.d-state b { color: var(--ink); font-weight: 500; }
.d-stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.d-stats b { display: block; font-size: 20px; font-weight: 600; }
.d-stats span { font-size: 12px; color: var(--sub); }
.d-task .kv { display: grid; grid-template-columns: auto 1fr; gap: 0 16px; font-size: 13.5px; margin: 0; }
.d-task .kv dt, .d-task .kv dd { margin: 0; padding-bottom: 10px; }
.d-task .kv dt { color: var(--sub); }
.d-task .kv dd { text-align: right; }
.d-banner { display: flex; gap: 8px; align-items: center; background: var(--blue-soft); color: #0b57c9; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin-bottom: 12px; }
.d-banner .agent-ic { width: 22px; height: 22px; }
.d-status { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.d-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: pulse 1.2s infinite; }
.d-status.go i { background: var(--blue); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.photos div { aspect-ratio: 1; max-width: 100%; border-radius: 8px; background: #f5f5f5; border: 1px dashed #d9d9d9; display: grid; place-items: center; font-size: 12px; color: #bfbfbf; }
.photos div.got { border: 0; color: #fff; background: linear-gradient(135deg, #8fb8ff, #3b82f6); }
.d-done { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.d-done .ck { width: 44px; height: 44px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; }
.d-done b { font-size: 17px; }
.d-done span { font-size: 13px; color: var(--sub); }
.d-pad { height: 16px; }

/* incoming offer sheet */
.sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; z-index: 2; }
.sheet { width: 100%; background: #fff; border-radius: 16px 16px 0 0; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 14px; animation: up .32s cubic-bezier(.2,.9,.3,1); }
.sheet-hd { display: flex; justify-content: space-between; align-items: center; }
.sheet-hd b { font-size: 13px; color: var(--blue); }
.sheet-hd span { font-size: 12px; color: var(--sub); }
.offer { display: flex; gap: 14px; align-items: center; }
.offer .tx { flex: 1; min-width: 0; }
.offer .nm { font-size: 18px; font-weight: 600; }
.offer .where { font-size: 13.5px; margin-top: 4px; }
.offer .amt { font-size: 26px; font-weight: 600; color: var(--red); margin-top: 6px; }
.offer .amt small { font-size: 15px; }
.ring { flex: none; }
</style>

<div class="wrap">
  <header class="lab-head">
    <h1>hive 风格实验室 · 第 3 轮：市场与接单台</h1>
    <p>用定下的支付宝账单式（蓝色、agent 横条、界面用“agent”）做两屏。左边是买家的市场首页，点能力可以展开卖家。右边是人工卖家的接单台：点“开始接单”，几秒后会来一张派单，可以走完抢单、等付款、拍照交付的全过程。</p>
  </header>
  <div class="seg tabs" id="tabs"></div>
  <main class="frames">
    <section class="spec" data-spec="m"><div class="spec-meta"><b>市场首页</b><p>参照支付宝首页：搜索框、宫格入口、待办提醒，下面是能力列表。</p></div>
      <div class="phone"><div class="screen" id="scr-m"></div></div></section>
    <section class="spec" data-spec="d"><div class="spec-meta"><b>接单台</b><p>参照滴滴司机端的“出车”：大开关、今日数据、派单从底部弹出、倒计时抢单。</p></div>
      <div class="phone"><div class="screen" id="scr-d"></div><div id="sheet"></div></div></section>
  </main>
</div>

<script>
const agentIc = (s = 16) => `<span class="agent-ic"><svg width="${s}" height="${s}" viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="9" rx="3" fill="#fff"/><circle cx="6" cy="8.5" r="1.1" fill="#1677ff"/><circle cx="10" cy="8.5" r="1.1" fill="#1677ff"/><path d="M8 1.5v2.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg></span>`;
const check = `<svg width="22" height="22" viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const yuan = (fen) => (fen / 100).toFixed(2);
const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

/* ---------- market ---------- */
const CAPS = [
  { k: "comp", icon: "竞品", color: "#1677ff", name: "竞品门店数据", desc: "给城市、商圈和品类，返回周边同类门店的名称、地址、评分和人均", from: 300, online: 12, done: "8,410", eta: "约 1 分钟",
    sellers: [["茶", "茶饮数据通", "agent", 500, "98%"], ["城", "城市洞察", "agent", 300, "95%"], ["数", "小数据铺", "agent", 600, "99%"]] },
  { k: "chart", icon: "图表", color: "#00b578", name: "对比图表", desc: "把一组数据画成对比图，附一句结论", from: 200, online: 7, done: "3,962", eta: "约 1 分钟",
    sellers: [["图", "图表小工", "agent", 300, "97%"], ["画", "画数师", "agent", 200, "93%"]] },
  { k: "photo", icon: "拍照", color: "#ff8f1f", name: "实地拍照", desc: "去指定地点拍门店、人流或街景，带拍摄时间和位置", from: 1500, online: 23, done: "1,207", eta: "约 2 小时",
    sellers: [["王", "王师傅", "person", 1500, "100%"], ["李", "李同学", "person", 1800, "96%"], ["周", "周阿姨", "person", 1500, "99%"]] },
];
const M = { open: "comp", payLeft: 14 * 60 + 12 };
function market() {
  return `<div class="ph">
    <div class="m-top">
      <div class="m-title">hive 市场<small>杭州 ▾</small></div>
      <div class="m-search">搜能力，例如“竞品数据”“拍照”</div>
      <div class="m-grid">${[["数据", "#1677ff"], ["图表", "#00b578"], ["拍照", "#ff8f1f"], ["更多", "#bfbfbf"]].map(([t, c]) => `<div><i style="background:${c}">${t.slice(0, 1)}</i>${t}</div>`).join("")}</div>
    </div>
    <div class="card m-pending">${agentIc()}<div class="tx">你的 agent「Claude」买了竞品门店数据<small>等你付款 ¥5.00 · 剩余 <span class="m-cd tnum">${mmss(M.payLeft)}</span></small></div><button class="btn sm" type="button">去付款</button></div>
    <div class="card"><h4>全部能力<span>价格最低、通过率高的卖家排在前面</span></h4>
      ${CAPS.map((c) => `<div class="cap">
        <button class="cap-hd" type="button" data-cap="${c.k}" aria-expanded="${M.open === c.k}"><i style="background:${c.color}">${c.icon}</i>
          <div class="tx"><b>${c.name}</b><small>${c.desc}</small></div><span class="pr">¥${yuan(c.from)}<small> 起</small></span></button>
        <div class="cap-meta"><span class="on">${c.online} 位在线</span><span>已成交 ${c.done} 单</span><span>${c.eta}交付</span></div>
        ${M.open === c.k ? `<div class="sellers">${c.sellers.map(([a, n, kind, p, r]) => `<div class="seller"><span class="av">${a}</span><div class="tx">${n}<span class="tag ${kind === "person" ? "person" : ""}">${kind === "person" ? "真人" : "agent"}</span><small>通过率 ${r}</small></div><span class="pr tnum">¥${yuan(p)}</span></div>`).join("")}</div>` : ""}
      </div>`).join("")}
    </div>
    <div class="d-pad"></div>
    <div class="tabbar"><span class="on"><i></i>市场</span><span><i></i>订单</span><span><i></i>接单</span><span><i></i>我的</span></div>
  </div>`;
}

/* ---------- dispatch desk ---------- */
const OFFER = { name: "实地拍照", where: "杭州 湖滨银泰 in77 · 拍 3 张奶茶店门头和排队情况", price: 1500, buyer: "小王的 agent「Claude」", limit: "2 小时内交付" };
const D = { online: false, phase: "idle", secs: 180, photos: 0, income: 3000, count: 2, minutes: 0, timer: null };
function later(ms, fn) { clearTimeout(D.timer); D.timer = setTimeout(fn, ms); }
function desk() {
  const busy = ["waitpay", "work", "done"].includes(D.phase);
  const label = D.online ? "接单中" : "开始接单";
  const state = !D.online ? "停止接单时不会收到派单" : D.phase === "listen" ? "<b>正在听单</b> · 有派单会从底部弹出" : D.phase === "offer" ? "<b>来新派单了</b>" : "<b>有一单在进行中</b>，完成前不会再派单";
  let task = "";
  if (D.phase === "waitpay" || D.phase === "work" || D.phase === "done") {
    const body = D.phase === "waitpay"
      ? `<div class="d-status"><i></i>抢到了，等买家付款</div><div class="d-banner">${agentIc(13)}这单由买家的 agent 发起，买家本人在支付宝确认付款</div>`
      : D.phase === "work"
        ? `<div class="d-status go"><i></i>买家已付款，可以开始了 · 剩 1:59:${String(59 - (D.photos * 7)).padStart(2, "0")}</div>
           <div class="photos">${[0, 1, 2].map((n) => `<div class="${n < D.photos ? "got" : ""}">${n < D.photos ? `门店 ${n + 1}` : "待拍"}</div>`).join("")}</div>
           ${D.photos < 3 ? `<button class="btn" type="button" data-d="shoot">拍照（${D.photos}/3）</button>` : `<button class="btn" type="button" data-d="submit">提交交付</button>`}`
        : `<div class="d-done"><span class="ck">${check}</span><b>已交付</b><span>¥15.00 已到你的支付宝 · 等买家验收</span></div><div style="height:12px"></div><button class="btn line" type="button" data-d="next">继续接单</button>`;
    task = `<div class="card d-task"><h4>${OFFER.name}<span class="tnum">¥${yuan(OFFER.price)}</span></h4>${body}
      <dl class="kv" style="margin-top:12px"><dt>地点</dt><dd>杭州 湖滨银泰 in77</dd><dt>要求</dt><dd>3 张门头和排队情况</dd><dt>下单方</dt><dd>${OFFER.buyer}</dd><dt>时限</dt><dd>${OFFER.limit}</dd></dl></div>`;
  }
  return `<div class="ph">
    <div class="d-head">
      <div class="d-nav"><span>‹</span><b>接单台</b><span>规则</span></div>
      <button class="d-toggle ${D.online ? "on" : ""}" type="button" data-d="toggle" ${busy ? "disabled" : ""}><span>${label}<small>${D.online ? `已在线 ${D.minutes} 分钟` : "像出车一样上线"}</small></span></button>
      <div class="d-state">${state}</div>
    </div>
    <div class="card d-stats"><div><b class="tnum">${yuan(D.income)}</b><span>今日收入（元）</span></div><div><b class="tnum">${D.count}</b><span>今日完成</span></div><div><b class="tnum">100%</b><span>通过率</span></div></div>
    ${task}
    <div class="card"><h4>我能接的能力<span>管理 ›</span></h4>
      <dl class="kv" style="display:grid;grid-template-columns:auto 1fr;gap:0 16px;margin:0;font-size:13.5px">
        <dt style="padding-bottom:10px">实地拍照</dt><dd style="margin:0;text-align:right;color:#8c8c8c">¥15.00 · 每天最多 5 单</dd>
        <dt>门店试吃报告</dt><dd style="margin:0;text-align:right;color:#8c8c8c">¥30.00 · 每天最多 2 单</dd></dl></div>
    <div class="d-pad"></div>
    <div class="tabbar"><span><i></i>市场</span><span><i></i>订单</span><span class="on"><i></i>接单</span><span><i></i>我的</span></div>
  </div>`;
}
function offerSheet() {
  if (D.phase !== "offer") return "";
  const L = 2 * Math.PI * 26, p = D.secs / 180;
  return `<div class="sheet-bg"><div class="sheet">
    <div class="sheet-hd"><b>新派单 · 同时派给 3 人，先抢先得</b><span>距你 1.2 公里</span></div>
    <div class="offer"><div class="tx"><div class="nm">${OFFER.name}</div><div class="where">${OFFER.where}</div><div class="amt"><small>¥</small>${yuan(OFFER.price)}</div></div>
      <svg class="ring" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#f0f0f0" stroke-width="5"/>
        <circle cx="32" cy="32" r="26" fill="none" stroke="${D.secs < 30 ? "#ff4d2d" : "#1677ff"}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L * (1 - p)}" transform="rotate(-90 32 32)"/>
        <text x="32" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">${mmss(D.secs)}</text></svg></div>
    <div class="d-banner" style="margin:0">${agentIc(13)}下单方：${OFFER.buyer}，付款由买家本人确认</div>
    <button class="btn" type="button" data-d="grab">抢单</button><button class="link" type="button" data-d="skip">不接这单</button>
  </div></div>`;
}

/* ---------- wiring ---------- */
const $ = (s) => document.querySelector(s);
const S = { focus: "d" };
function render() {
  $("#scr-m").innerHTML = market();
  $("#scr-d").innerHTML = desk();
  $("#sheet").innerHTML = offerSheet();
  $("#tabs").innerHTML = [["m", "市场首页"], ["d", "接单台"]].map(([k, n]) => `<button type="button" data-tab="${k}" class="${S.focus === k ? "on" : ""}">${n}</button>`).join("");
  document.querySelectorAll("[data-spec]").forEach((b) => b.classList.toggle("focus", b.dataset.spec === S.focus));
}
function listen(ms = 3000) { D.phase = "listen"; later(ms, () => { D.phase = "offer"; D.secs = 180; render(); }); }
const ACT = {
  toggle() { D.online = !D.online; if (D.online) listen(); else { clearTimeout(D.timer); D.phase = "idle"; } },
  grab() { D.phase = "waitpay"; later(3000, () => { D.phase = "work"; render(); }); },
  skip() { listen(6000); },
  shoot() { D.photos = Math.min(3, D.photos + 1); },
  submit() { D.phase = "done"; D.income += OFFER.price; D.count += 1; },
  next() { D.photos = 0; listen(); },
};
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-d],[data-cap],[data-tab]");
  if (!t) return;
  if (t.dataset.tab) S.focus = t.dataset.tab;
  else if (t.dataset.cap) M.open = M.open === t.dataset.cap ? null : t.dataset.cap;
  else ACT[t.dataset.d]?.();
  render();
});
setInterval(() => {
  if (M.payLeft > 0) { M.payLeft--; document.querySelectorAll(".m-cd").forEach((el) => (el.textContent = mmss(M.payLeft))); }
  if (D.phase === "offer") { D.secs--; if (D.secs <= 0) listen(6000); $("#sheet").innerHTML = offerSheet(); }
}, 1000);
setInterval(() => { if (D.online) { D.minutes++; render(); } }, 60000);
render();
</script>
