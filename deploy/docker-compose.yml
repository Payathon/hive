# Production stack for one Linux VM: hive + Postgres. HTTPS comes from one of two overrides,
# picked with COMPOSE_FILE in .env (see deploy/README.md):
#   docker-compose.edge.yml    shared server: join the `edge` network, the edge Caddy (deploy/edge) proxies to hive
#   docker-compose.caddy.yml   hive alone on the machine: its own Caddy on 80/443
# In /opt/hive next to .env:  ./up.sh   (CD runs the same script)
# Build the image on the machine instead of pulling it: add docker-compose.build.yml to COMPOSE_FILE.
name: hive

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  hive:
    image: ${HIVE_IMAGE:-ghcr.io/payathon/hive:latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://hive:${POSTGRES_PASSWORD}@postgres:5432/hive}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      WEB_URL: ${WEB_URL:-https://${DOMAIN}}
    volumes:
      # Delivered files, vapid.json (Web Push keys), fake-pay.json (fake payment state).
      - hive-data:/data
      # Optional key files for ALIPAY_*_PATH (e.g. /secrets/app_private.txt); inline keys need nothing here.
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hive
      POSTGRES_DB: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

volumes:
  pgdata:
  hive-data:
